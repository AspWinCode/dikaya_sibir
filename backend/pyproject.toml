[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nocode-platform-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web
    # fastapi pinned past 0.115.5 specifically to pull a patched starlette
    # (several PYSEC advisories against 0.41.3 were only fixed at >=1.3.1;
    # fastapi>=0.133 drops its own upper bound on starlette, so pin both).
    "fastapi==0.133.0",
    "starlette>=1.3.1",
    "uvicorn[standard]==0.32.1",
    "gunicorn==23.0.0",
    "httpx==0.27.2",

    # Data / ORM
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",

    # Validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",

    # Auth
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==3.2.2",            # passlib 1.7.4 detect_wrap_bug uses >72-byte test, breaks bcrypt>=4
    "python-multipart==0.0.32",

    # Task queue
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "kombu==5.4.2",

    # Storage
    "boto3==1.35.82",

    # Templating / email
    "jinja2==3.1.6",
    "aiosmtplib==5.1.3",

    # Observability
    "structlog==24.4.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
    "opentelemetry-exporter-otlp==1.29.0",
    "prometheus-client==0.21.1",

    # Rate limiting
    "slowapi==0.1.9",

    # OTP / 2FA
    "pyotp==2.9.0",

    # LDAP
    "ldap3==2.9.1",

    # Import / Export
    "openpyxl==3.1.5",
    "fpdf2==2.8.2",

    # Utilities
    "python-slugify==8.0.4",
    "orjson==3.11.6",
    "ulid-py==1.1.0",
]

[project.optional-dependencies]
# Minimal set to RUN the test suite. Excludes semgrep/ruff/mypy/bandit on
# purpose: semgrep pins opentelemetry-api~=1.25 which conflicts with the app's
# pinned 1.29, making `.[dev]` unresolvable. Used by the dockerized test stack.
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "factory-boy==3.3.1",
    "faker==33.1.0",
    "httpx==0.27.2",
    "anyio==4.7.0",
    "pytest-postgresql==6.1.1",
]
load = [
    "locust==2.32.4",
]
# Lint/type-check only — kept separate from `test` and `dev` because `dev`
# pulls in semgrep, which pins opentelemetry-api~=1.25 and conflicts with the
# app's pinned 1.29 (see the note on `test` above). CI's lint job uses this.
lint = [
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-redis==4.6.0.20241004",
    "types-passlib==1.7.7.20240819",
    "types-python-jose==3.3.4.20240106",
    "types-openpyxl==3.1.5.20241114",
    "types-fpdf2==2.8.1.20241221",
]
dev = [
    # Testing
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "factory-boy==3.3.1",
    "faker==33.1.0",
    "httpx==0.27.2",
    "anyio==4.7.0",

    # Test DB
    "pytest-postgresql==6.1.1",

    # Lint / format
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-redis==4.6.0.20241004",
    "types-passlib==1.7.7.20240819",
    "types-python-jose==3.3.4.20240106",

    # Security
    "bandit[toml]==1.8.0",
    "pip-audit==2.7.3",
    "semgrep==1.101.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TCH",      # flake8-type-checking
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "A",        # flake8-builtins
    "ANN",      # flake8-annotations
]
ignore = [
    "S101",    # allow assert in tests
    "B008",    # FastAPI Depends() in default args
    # RUF001-003 flag Cyrillic letters as "ambiguous" (confusable with Latin
    # look-alikes) — this is a homoglyph-attack heuristic aimed at untrusted
    # user content, not a fit for an app whose UI copy, seed data, and error
    # messages are legitimately Russian throughout. Keeping it on would mean
    # tagging essentially every Russian string literal in the codebase.
    "RUF001", "RUF002", "RUF003",
    # The rules engine, field-crypto, and expression evaluator operate on
    # genuinely dynamic JSON-shaped values (arbitrary record payloads, AST
    # nodes) by design — `Any` there is the correct type, not a shortcut.
    "ANN401",
    # TCH/TC flags moving imports into `if TYPE_CHECKING:` purely to shave
    # import time. In a FastAPI + Pydantic app many of those "type-only"
    # imports (schemas, AsyncSession, etc.) are exactly what FastAPI's
    # dependency injection and Pydantic's runtime validation need to exist
    # as real objects, not string-only annotations — ruff's own unsafe-fix
    # classification for this rule agrees. The risk of silently breaking
    # runtime behavior isn't worth the import-time micro-optimization.
    "TCH001", "TCH002", "TCH003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"alembic/**" = ["ANN", "N999"]
# __table_args__/__mapper_args__ dict literals are SQLAlchemy declarative
# class-level config read by the ORM metaclass, not instance state shared
# across objects — RUF012's mutable-default concern doesn't apply to them.
"app/models/**" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
# This is a no-code platform: every JSONB column, rule AST node, and
# metamodel-driven record payload is a genuinely bare `dict`/`list` whose
# shape is defined by user configuration at runtime, not by a Python type.
# `disallow_any_generics` (part of `strict`) would require parameterizing
# ~100 such occurrences across ~30 files with `dict[str, Any]`/`list[Any]`,
# which adds no real type safety here — "Any" is the accurate type, not a
# shortcut. Scoped to this one flag rather than relaxing `strict` wholesale.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "boto3.*", "botocore.*", "jose.*", "passlib.*"]
ignore_missing_imports = true

# Celery's `@shared_task` has no type stubs that preserve the wrapped
# function's signature, so mypy sees every task as "untyped" regardless of
# how its own parameters/return are annotated — a known upstream gap, not
# a real issue in this code. Scoped to the task modules only.
[[tool.mypy.overrides]]
module = ["app.worker.tasks.*", "app.worker.celery_app"]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Each test gets its own loop; async fixtures share that test's loop so the
# function-scoped DB engine/pool stays on a single, live event loop.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: mark test as integration (requires DB/Redis)",
    "unit: mark test as unit (no external services)",
    "slow: mark test as slow",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/seeds/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
