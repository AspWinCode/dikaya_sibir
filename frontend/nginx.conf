server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Old /editor/... links (bookmarks, e-mails already sent, OAuth redirects)
    # keep working: strip the prefix, keep the query string. Relative Location
    # because this nginx sits behind another one that terminates TLS.
    location ~ ^/editor(/|$) {
        absolute_redirect off;
        rewrite ^/editor/?(.*)$ /$1 permanent;
    }

    # A link to "/app" without the trailing slash would otherwise fall into the
    # SPA fallback below.
    location = /app {
        return 302 $scheme://$http_host/app/;
    }

    # Runtime bundle (end-user app) — built with base /app/
    location /app/ {
        alias /usr/share/nginx/html/runtime/;
        try_files $uri $uri/ /app/index.html;
    }
    location = /app/index.html {
        alias /usr/share/nginx/html/runtime/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Editor (App Builder) — the SPA, built with base "/", served from the root.
    # Unknown paths fall back to index.html so client-side routes (/signin,
    # /login, /admin ...) work on reload.
    location / {
        root /usr/share/nginx/html/editor;
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html/editor;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API proxy → backend (in dev, Vite proxy handles this instead)
    location /api {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
